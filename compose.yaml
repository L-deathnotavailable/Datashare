name: datashare

services:
  php:
    image: datashare-php
    build:
      context: ./docker/php
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: datashare-files
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run scripts/setup.ps1}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run scripts/setup.ps1}
      APP_SECRET: ${APP_SECRET:?Configure APP_SECRET in .env}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?Configure JWT_PASSPHRASE in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=17&charset=utf8
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var
    depends_on:
      database:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: ['mini', '-dir=/data', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run scripts/setup.ps1}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run scripts/setup.ps1}
      S3_BUCKET: datashare-files
    volumes:
      - seaweed_data:/data

  expiry-worker:
    extends:
      service: php
    command: ['sh', '-c', 'while true; do php bin/console app:files:purge-expired --no-interaction; sleep 60; done']
    depends_on:
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: true
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

  web:
    image: nginx:1.28-alpine
    ports:
      - 127.0.0.1:${APP_PORT:-8088}:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
    depends_on:
      - php
      - frontend

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Configure PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configure PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'True'
    ports:
      - 127.0.0.1:${PGADMIN_PORT:-5058}:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
  pgadmin_data:
  backend_vendor:
  backend_var:
  frontend_modules:
  seaweed_data:
