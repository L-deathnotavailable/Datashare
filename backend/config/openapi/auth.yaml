openapi: 3.0.3
info:
  title: DataShare — Authentification
  version: 0.1.0
  description: Contrat des routes implémentées. Les routes de fichiers seront ajoutées au fil du développement.
servers:
  - url: http://localhost:8088/api
paths:
  /auth/register:
    post:
      operationId: register
      summary: Créer un compte
      description: E-mail normalisé en minuscules, sans espaces de bord. Maximum 5 tentatives par IP en 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: E-mail déjà utilisé
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Le corps doit être en JSON
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Champs invalides
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      operationId: login
      summary: Obtenir un JWT
      description: Maximum 5 échecs par identifiant et IP par minute ; limite globale par IP appliquée par Symfony. E-mail normalisé avant recherche.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Jeton signé, conservé en mémoire par le front
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, enum: [Bearer] }
                  expiresIn: { type: integer, example: 3600 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415':
          description: Le corps doit être en JSON
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me:
    get:
      operationId: getCurrentUser
      summary: Consulter son profil
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Utilisateur identifié par le JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      operationId: checkHealth
      summary: Vérifier l'API et sa connexion à PostgreSQL
      responses:
        '200':
          description: API et base disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '500':
          description: Service indisponible
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Registration:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 4096, writeOnly: true }
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
  responses:
    BadRequest:
      description: JSON incorrect, types invalides ou requête trop volumineuse
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Identifiants incorrects, JWT absent, expiré ou invalide
      headers:
        WWW-Authenticate: { schema: { type: string }, description: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Trop de tentatives
      headers:
        Retry-After: { schema: { type: integer }, description: Délai en secondes }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
